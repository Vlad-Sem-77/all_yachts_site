kind = "web"
previewPath = "/"
title = "Лодки, катера, яхты"
description = "Русскоязычная доска объявлений о лодках, катерах, яхтах, моторах и оборудовании."
version = "1.0.0"
id = "artifacts/board"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21663

[services.development]
run = "pnpm --filter @workspace/board run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/board", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/board/dist/server.mjs" ]

[services.production.run.env]
PORT = "21663"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "21663"
BASE_PATH = "/"
