name: Publish Deploy-F images

on:
  push:
    branches:
      - deploy-f

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish site and API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vlad-sem-77/all-yachts-site:deploy-f
          build-args: |
            CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
            VITE_CLERK_PROXY_URL=/api/__clerk
          labels: |
            org.opencontainers.image.source=https://github.com/vlad-sem-77/all_yachts_site
            org.opencontainers.image.description=ALL-YACHTS.RU site and API for Deploy-F

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vlad-sem-77/all-yachts-site-migrate:deploy-f
          labels: |
            org.opencontainers.image.source=https://github.com/vlad-sem-77/all_yachts_site
            org.opencontainers.image.description=ALL-YACHTS.RU database migrations for Deploy-F

      - name: Build and publish proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deploy-f-proxy
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vlad-sem-77/all-yachts-site-proxy:deploy-f
